[project]
name = "citadel-archive"
dynamic = ["version"]
description = "Citadel — a self-hosted Organization Vault and seat-capture CLI built on Cognee."
readme = "README.md"
# 3.11 is the true floor, not a preference: kb/ imports `datetime.UTC` (added
# in 3.11) in seven modules, and the test suite imports `tomllib` (3.11 stdlib).
# The previous ">=3.10" let pip install a package that then raised ImportError
# on the first sync command.
requires-python = ">=3.11"
license = "Apache-2.0"
# Apache-2.0 §4(a) requires the License text to travel with every distribution.
# Without this the sdist/wheel published by .github/workflows/publish.yml would
# carry the license *declaration* but not the license *file*.
license-files = ["LICENSE", "NOTICE"]
keywords = ["knowledge-base", "vault", "cli", "cognee", "rag", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
# Base install = the lightweight teammate CLI (onboard / status / capture / setup).
# These commands are pure standard library — zero third-party deps. The server
# stack (and python-dotenv for .env loading) lives in the [server] extra.
dependencies = []

[project.optional-dependencies]
# `pip install citadel-archive[server]` — run the Node/MCP server + sync jobs.
server = [
    "aiohttp>=3.14.3,<4.0.0",
    # Must match requirements.txt exactly (#150). The 1.2.x cap is load-bearing:
    # ADR-0009 dataset attribution reads cognee PRIVATE internals
    # (cognee.modules.data.models, get_default_user) that a 1.3.x could move,
    # silently fail-closed, and blank every scoped caller's vault. Railway
    # installs from requirements.txt, so a looser bound here is inert in
    # production — but it bites any `pip install -e .`, and a dev env resolving
    # a newer cognee against the production DATABASE_URL re-stamps the
    # migration row forward (the 2026-07-13 cognee-1.3.0 incident).
    "cognee[fastembed,postgres-binary]>=1.2.2,<1.3.0",
    "cryptography>=50.0.0,<51.0.0",
    "fastapi>=0.116.2,<1.0.0",
    "google-auth>=2.40.0,<3.0.0",
    "mcp>=1.28.1,<2.0.0",
    "pydantic>=2.10.5,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "starlette>=1.3.1,<2.0.0",
    "tiktoken==0.13.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/masumi-network/Citadel"
Repository = "https://github.com/masumi-network/Citadel"
Issues = "https://github.com/masumi-network/Citadel/issues"

[project.scripts]
citadel = "kb.cli:main"

[dependency-groups]
dev = [
    "pip-audit>=2.7.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.21.1,<2",
    "ruff>=0.9.2,<1",
]


[tool.uv]
# Pin transitive deps with known CVEs until upstream (cognee/fastapi stack) catches up.
override-dependencies = [
    "pillow>=12.3.0",
    "pypdf>=6.13.3",
    "python-multipart>=0.0.31",
    # Ten CVEs disclosed against 0.59.0 after main last ran CI on 2026-07-24.
    # Pulled in transitively; the highest fix version among them is 0.64.0.
    "datamodel-code-generator>=0.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kb"]
# The browser frontend ships inside the wheel. A self-hoster runs
# `pip install citadel-archive[server]` on a machine that has Python and may not
# have Node, so the built files have to be package data rather than something
# the install step produces. kb/static/ is hand-written and comes along as part
# of the package; kb/webui/ is generated by `npm run build:web`, and naming it
# here keeps it in the wheel even if a future .gitignore rule ever decides
# generated output does not belong in the tree.
artifacts = ["kb/webui/**", "kb/data/tiktoken-cache/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "canary: agent-feedback acceptance canary (unit mocks)",
    "live: optional live Node probe (needs CITADEL_CANARY_LIVE=1 + token)",
]
