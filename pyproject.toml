[project]
name = "citadel-archive"
dynamic = ["version"]
description = "Citadel — a self-hosted Organization Vault and seat-capture CLI built on Cognee."
readme = "README.md"
# 3.11 is the true floor, not a preference: kb/ imports `datetime.UTC` (added
# in 3.11) in seven modules, and the test suite imports `tomllib` (3.11 stdlib).
# The previous ">=3.10" let pip install a package that then raised ImportError
# on the first sync command.
requires-python = ">=3.11"
license = "Apache-2.0"
# Apache-2.0 §4(a) requires the License text to travel with every distribution.
# Without this the sdist/wheel published by .github/workflows/publish.yml would
# carry the license *declaration* but not the license *file*.
license-files = ["LICENSE", "NOTICE"]
keywords = ["knowledge-base", "vault", "cli", "cognee", "rag", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
# Base install = the lightweight teammate CLI (onboard / status / capture / setup).
# These commands are pure standard library — zero third-party deps. The server
# stack (and python-dotenv for .env loading) lives in the [server] extra.
dependencies = []

[project.optional-dependencies]
# `pip install citadel-archive[server]` — run the Node/MCP server + sync jobs.
server = [
    "aiohttp>=3.14.3,<4.0.0",
    # Exact pin required because Citadel reads Cognee private dataset APIs and
    # registers its audited Qdrant adapter against Cognee's internal maps.
    "cognee[fastembed]==1.4.1",
    "ladybug==0.18.2",
    # Real tokenizer for BGE chunk sizing; the resolver silently falls back to
    # approximate TikToken counts when transformers is missing.
    "transformers==5.15.0",
    "cryptography==50.0.0",
    "fastapi>=0.116.2,<1.0.0",
    "google-auth>=2.40.0,<3.0.0",
    "mcp>=1.28.1,<2.0.0",
    "pydantic>=2.10.5,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "qdrant-client==1.19.0",
    "requests>=2.32.0,<3.0.0",
    "starlette>=1.3.1,<2.0.0",
    "tiktoken==0.13.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/masumi-network/Citadel"
Repository = "https://github.com/masumi-network/Citadel"
Issues = "https://github.com/masumi-network/Citadel/issues"

[project.scripts]
citadel = "kb.cli:main"

[dependency-groups]
dev = [
    "build==1.5.0",
    "hatchling==1.31.0",
    "pip-audit>=2.7.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.21.1,<2",
    "ruff>=0.9.2,<1",
]


[tool.uv]
# Pin transitive deps with known CVEs until upstream (cognee/fastapi stack) catches up.
override-dependencies = [
    # Cognee 1.4.1 declares cryptography <50. Runtime and adapter tests pass
    # against 50.0.0, which fixes CVE-2026-69247. Remove this override when
    # Cognee publishes corrected metadata.
    "cryptography==50.0.0",
    "pillow>=12.3.0",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.31",
    # Ten CVEs disclosed against 0.59.0 after main last ran CI on 2026-07-24.
    # Pulled in transitively; the highest fix version among them is 0.64.0.
    "datamodel-code-generator>=0.64.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kb/__init__.py"

[tool.hatch.build.targets.wheel]
# kb.server runs the evolve scheduler in-process (Ladybug is single-writer, so
# it cannot move to a separate process) and imports scripts.run_railway for the
# loop body. The published image installs only this wheel, so scripts/ must ship
# in it or the scheduler dies on boot with ModuleNotFoundError: No module named
# 'scripts'. The scripts.run_railway job/dispatcher modes are packaged for the
# same reason (github-sync, backup-mirror, evolve).
packages = ["kb", "scripts"]
# The browser frontend ships inside the wheel. A self-hoster runs
# `pip install citadel-archive[server]` on a machine that has Python and may not
# have Node, so the built files have to be package data rather than something
# the install step produces. kb/static/ is hand-written and comes along as part
# of the package; kb/webui/ is generated by `npm run build:web`, and naming it
# here keeps it in the wheel even if a future .gitignore rule ever decides
# generated output does not belong in the tree.
artifacts = ["kb/webui/**", "kb/data/tiktoken-cache/*"]

# kb.skills and kb.repo_stats resolve public runtime data relative to the
# installed site-packages root. Keep both complete tracked trees there so the
# hosted catalog and locally derived ADR count match a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"docs/adr" = "docs/adr"

# The repository-wide `*-export.md` ignore pattern matches ADR 0014 even though
# it is tracked. Force the complete tree into the sdist so wheel and source
# distributions carry the same public runtime records.
[tool.hatch.build.targets.sdist.force-include]
"docs/adr" = "docs/adr"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "canary: agent-feedback acceptance canary (unit mocks)",
    "live: optional live Node probe (needs CITADEL_CANARY_LIVE=1 + token)",
]
