name: Test

# The merge gate for this repository.
#
# A merge to `main` auto-deploys to the Railway node, so a red run here is the
# only thing standing between a bad merge and a bad production deploy.
#
# Everything below also runs locally — see CONTRIBUTING.md:
#   uv sync --all-extras --dev
#   uv run ruff check .
#   uv run pytest tests/ -q

on:
  pull_request:
  push:
    branches:
      - main

# A superseded run proves nothing, so cancel outdated PR runs. Never cancel a
# run on `main`: each of those is the record for a commit that may deploy.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. This workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  test:
    # Matrix legs surface as "pytest + ruff (3.11)", "pytest + ruff (3.12)".
    # Branch protection requires the aggregate `CI gate` job below instead, so
    # the required check name stays stable when this matrix changes.
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: seven kb/ modules do `from datetime import UTC`,
        # which landed in 3.11, and tests/test_railway_entrypoint.py imports
        # `tomllib` (3.11 stdlib). This matches requires-python in pyproject.toml
        # and the gate in install.sh — keep all three in step.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Select Python ${{ matrix.python-version }}
        # The repo ships a `.python-version` pin of 3.12. Without this pin step
        # every matrix leg would silently resolve to 3.12 and the matrix would
        # be decorative. `uv python pin` rewrites it for this runner only.
        run: |
          uv python install ${{ matrix.python-version }}
          uv python pin ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-extras pulls in the `server` optional-dependency group
        # (fastapi, mcp, cognee, …); the test suite imports kb.server and the
        # MCP module, so a base-only sync fails collection with ModuleNotFound.
        run: uv sync --locked --all-extras --dev

      - name: Install audited Cognee build
        shell: bash
        run: |
          secure_cognee="$RUNNER_TEMP/secure-cognee"
          uv run python scripts/build_secure_cognee.py --output "$secure_cognee"
          wheels=("$secure_cognee"/cognee-*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --reinstall --no-deps "${wheels[0]}"

      - name: Confirm the interpreter actually under test
        run: uv run python -c "import sys; print(sys.version)"

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest tests/ -q

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install audited Cognee build
        shell: bash
        run: |
          secure_cognee="$RUNNER_TEMP/secure-cognee"
          uv run python scripts/build_secure_cognee.py --output "$secure_cognee"
          wheels=("$secure_cognee"/cognee-*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --reinstall --no-deps "${wheels[0]}"

      - name: pip-audit
        # PYSEC-2026-2447 is ignored pending an upstream fix. CVEs that already
        # have a fixed release are pinned out via [tool.uv] override-dependencies
        # in pyproject.toml rather than ignored here.
        run: |
          uv run pip-audit --cache-dir .pip-audit-cache \
            --ignore-vuln PYSEC-2026-2447

  plain-requirements-smoke:
    name: plain requirements install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements with plain pip
        shell: bash
        run: |
          venv="$RUNNER_TEMP/citadel-requirements"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "build==1.5.0" "hatchling==1.31.0"
          secure_cognee="$RUNNER_TEMP/secure-cognee"
          "$venv/bin/python" scripts/build_secure_cognee.py --output "$secure_cognee"
          wheels=("$secure_cognee"/cognee-*.whl)
          test "${#wheels[@]}" -eq 1
          "$venv/bin/python" -m pip install --no-deps "${wheels[0]}"
          "$venv/bin/python" -m pip install -r requirements.txt
          "$venv/bin/python" -m pip install "pytest>=9.0.3,<10"
          "$venv/bin/python" -m pip check
          "$venv/bin/python" -m pytest tests/test_dependency_pins.py -q

  benchmark:
    name: benchmark fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Set up Python
        run: |
          uv python install 3.12
          uv python pin 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run benchmark harness self-check
        run: >-
          uv run citadel bench ci
          --questions scripts/bench/golden_questions_ci.json
          --ground-truth scripts/bench/ground_truth_ci

  web:
    name: frontend export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Typecheck Next app
        run: npm run typecheck --workspace web

      - name: Build committed frontend export
        run: npm run build:web

      - name: Require a reproducible committed export
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- kb/webui)" ]]; then
            echo "::error::kb/webui is not reproducible from the committed source and lockfile."
            git status --short -- kb/webui
            git diff -- kb/webui
            exit 1
          fi

  package-smoke:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build --wheel --sdist

      - name: Install wheel server extra and verify payloads
        shell: bash
        run: |
          venv="$RUNNER_TEMP/citadel-wheel"
          python -m venv "$venv"
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          "$venv/bin/python" -m pip install "build==1.5.0" "hatchling==1.31.0"
          secure_cognee="$RUNNER_TEMP/secure-cognee"
          "$venv/bin/python" scripts/build_secure_cognee.py --output "$secure_cognee"
          cognee_wheels=("$secure_cognee"/cognee-*.whl)
          test "${#cognee_wheels[@]}" -eq 1
          "$venv/bin/python" -m pip install --no-deps "${cognee_wheels[0]}"
          "$venv/bin/python" -m pip install "${wheels[0]}[server]"
          "$venv/bin/python" -m pip install "pytest>=9.0.3,<10"
          "$venv/bin/python" -m pip check
          "$venv/bin/python" -m pytest tests/test_dependency_pins.py -q
          verifier_home="$RUNNER_TEMP/citadel-verifier-home"
          mkdir -p "$verifier_home"
          (
            cd "$RUNNER_TEMP"
            HOME="$verifier_home" env -u PYTHONPATH "$venv/bin/python" -I \
              "$GITHUB_WORKSPACE/scripts/verify_package_artifacts.py" \
              --dist "$GITHUB_WORKSPACE/dist" \
              --public-routes
          )
          test -z "$(find "$verifier_home" -mindepth 1 -print -quit)"
          "$venv/bin/citadel" bench --help >/dev/null

  container-tests:
    name: Docker test target
    runs-on: ubuntu-latest
    # A few minutes to build (including ~64 MiB of baked ONNX weights) and a
    # few more to run the suites, so this is several times the working
    # duration. It exists to cap a hang, not to pace the job: without it a
    # stuck step burns the 360-minute default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker test target
        run: docker build --target test --tag citadel-archive:ci-test .

      - name: Prove baked embedding engine works offline
        run: |
          docker run --rm --network none \
            --env CITADEL_EMBEDDING_BAKE_SMOKE=1 \
            citadel-archive:ci-test \
            python -m pytest -q tests/test_embedding_bake_smoke.py
      - name: Run non-live and Qdrant contract suites with captured logs
        shell: bash
        run: |
          set -euo pipefail
          command -v grep >/dev/null
          network="citadel-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_qdrant="${network}-source-qdrant"
          restore_success_qdrant="${network}-restore-success-qdrant"
          restore_rollback_qdrant="${network}-restore-rollback-qdrant"
          qdrant_key="citadel-ci-qdrant-key"
          qdrant_image="qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc"
          log_dir="$RUNNER_TEMP/citadel-container-tests-logs"
          expected_qdrant_log_pattern='TLS (is )?disabled'
          mkdir -p "$log_dir"
          # Read each container's log once, after the fact. The daemon buffers
          # all of it, so this captures what a live follower would have, minus
          # that pattern's failure mode: in `docker logs --follow | tee f &` the
          # recorded pid is tee's, so killing it leaves docker logs running on an
          # idle container, and waiting on that job then never returns.
          capture_container_logs() {
            docker logs --timestamps "$source_qdrant" > "$log_dir/source-qdrant.log" 2>&1 || true
            docker logs --timestamps "$restore_success_qdrant" > "$log_dir/restore-success-qdrant.log" 2>&1 || true
            docker logs --timestamps "$restore_rollback_qdrant" > "$log_dir/restore-rollback-qdrant.log" 2>&1 || true
          }
          assert_clean_container_logs() {
            local log_file
            local -a grep_statuses
            local grep_status
            for log_file in "$@"; do
              # capture_container_logs swallows its own errors, so an empty file
              # would otherwise read as a clean log rather than a missing one.
              if [[ ! -s "$log_file" ]]; then
                echo "::error::No log was captured from $log_file"
                return 1
              fi
              # Fatal classes cannot share the warning allowlist. Otherwise a
              # warning substring on the same line can hide a fatal condition.
              if grep -Eni \
                'error|traceback|exception|died|critical|panic|fatal|oom|corrupt|failure|failed' \
                "$log_file"; then
                echo "::error::Unexpected fatal container log in $log_file"
                return 1
              else
                grep_status=$?
                if (( grep_status > 1 )); then
                  echo "::error::Fatal container log grep failed for $log_file"
                  return 1
                fi
              fi
              if grep -Eni \
                'warn(ing)?|recovery.*(shortfall|failed)' \
                "$log_file" | grep -Evi -- "$expected_qdrant_log_pattern"; then
                echo "::error::Unexpected severe container log in $log_file"
                return 1
              else
                grep_statuses=("${PIPESTATUS[@]}")
                if (( grep_statuses[0] > 1 || grep_statuses[1] > 1 )); then
                  echo "::error::Container log classifier grep failed for $log_file"
                  return 1
                fi
              fi
              if grep -En 'HTTP/[0-9.]+" [45][0-9][0-9]' "$log_file"; then
                echo "::error::Unexpected HTTP 4xx/5xx container log in $log_file"
                return 1
              else
                grep_status=$?
                if (( grep_status > 1 )); then
                  echo "::error::Container HTTP log grep failed for $log_file"
                  return 1
                fi
              fi
            done
          }
          cleanup() {
            capture_container_logs
            docker inspect "$source_qdrant" "$restore_success_qdrant" "$restore_rollback_qdrant" 2>/dev/null || true
            docker rm -f "$source_qdrant" "$restore_success_qdrant" "$restore_rollback_qdrant" 2>/dev/null || true
            docker volume rm \
              "${source_qdrant}-storage" "${source_qdrant}-snapshots" \
              "${restore_success_qdrant}-storage" "${restore_success_qdrant}-snapshots" \
              "${restore_rollback_qdrant}-storage" "${restore_rollback_qdrant}-snapshots" 2>/dev/null || true
            docker network rm "$network" 2>/dev/null || true
          }
          trap cleanup EXIT
          docker network create "$network"
          # Every Qdrant here gets its own storage and snapshot volumes. Without
          # them Qdrant reports its data as living on the container filesystem,
          # which assert_clean_container_logs treats as the durability failure it
          # is. The volume names carry the run id, so each run starts empty and
          # cleanup removes them.
          docker run --detach --name "$source_qdrant" --network "$network" \
            --env "QDRANT__SERVICE__API_KEY=$qdrant_key" \
            --env QDRANT__TELEMETRY_DISABLED=true \
            --volume "${source_qdrant}-storage:/qdrant/storage" \
            --volume "${source_qdrant}-snapshots:/qdrant/snapshots" \
            --security-opt no-new-privileges:true \
            qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
          docker run --detach --name "$restore_success_qdrant" --network "$network" \
            --env "QDRANT__SERVICE__API_KEY=$qdrant_key" \
            --env QDRANT__TELEMETRY_DISABLED=true \
            --volume "${restore_success_qdrant}-storage:/qdrant/storage" \
            --volume "${restore_success_qdrant}-snapshots:/qdrant/snapshots" \
            --security-opt no-new-privileges:true \
            qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
          docker run --detach --name "$restore_rollback_qdrant" --network "$network" \
            --env "QDRANT__SERVICE__API_KEY=$qdrant_key" \
            --env QDRANT__TELEMETRY_DISABLED=true \
            --volume "${restore_rollback_qdrant}-storage:/qdrant/storage" \
            --volume "${restore_rollback_qdrant}-snapshots:/qdrant/snapshots" \
            --security-opt no-new-privileges:true \
            qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
          for attempt in {1..30}; do
            if docker run --rm --network "$network" citadel-archive:ci-test python -c \
              "from qdrant_client import QdrantClient; client = QdrantClient(url='http://$source_qdrant:6333', api_key='$qdrant_key'); client.get_collections(); client.close()" \
              && docker run --rm --network "$network" citadel-archive:ci-test python -c \
                "from qdrant_client import QdrantClient; client = QdrantClient(url='http://$restore_success_qdrant:6333', api_key='$qdrant_key'); client.get_collections(); client.close()" \
              && docker run --rm --network "$network" citadel-archive:ci-test python -c \
                "from qdrant_client import QdrantClient; client = QdrantClient(url='http://$restore_rollback_qdrant:6333', api_key='$qdrant_key'); client.get_collections(); client.close()"; then
              break
            fi
            sleep 2
          done
          docker run --rm --network "$network" \
            --env "CITADEL_QDRANT_SERVER_IMAGE=$qdrant_image" \
            citadel-archive:ci-test python -m pytest -q -m "not live"
          docker run --rm --network "$network" \
            --env "CITADEL_QDRANT_SERVER_IMAGE=$qdrant_image" \
            citadel-archive:ci-test python -m ruff check .
          docker run --rm --network "$network" \
            --env "CITADEL_QDRANT_SERVER_IMAGE=$qdrant_image" \
            --env "CITADEL_QDRANT_LIVE_URL=http://$source_qdrant:6333" \
            --env "CITADEL_QDRANT_LIVE_KEY=$qdrant_key" \
            --env "CITADEL_QDRANT_RESTORE_URL=http://$restore_success_qdrant:6333" \
            --env "CITADEL_QDRANT_RESTORE_KEY=$qdrant_key" \
            citadel-archive:ci-test python -m pytest -q \
              tests/test_qdrant_adapter_live.py \
              tests/test_cognee_qdrant_sqlite_live.py
          docker run --rm --network "$network" \
            --env "CITADEL_QDRANT_LIVE_URL=http://$source_qdrant:6333" \
            --env "CITADEL_QDRANT_LIVE_KEY=$qdrant_key" \
            citadel-archive:ci-test python -c \
              "from qdrant_client import QdrantClient; client = QdrantClient(url='http://$source_qdrant:6333', api_key='$qdrant_key'); assert client.get_collections().collections; client.close()"
          docker run --rm --network "$network" \
            --env "CITADEL_QDRANT_SERVER_IMAGE=$qdrant_image" \
            --env "CITADEL_QDRANT_LIVE_URL=http://$source_qdrant:6333" \
            --env "CITADEL_QDRANT_LIVE_KEY=$qdrant_key" \
            --env "CITADEL_QDRANT_RESTORE_URL=http://$restore_success_qdrant:6333" \
            --env "CITADEL_QDRANT_RESTORE_KEY=$qdrant_key" \
            citadel-archive:ci-test python -m pytest -q \
              tests/test_generation_backup_live.py::test_generation_backup_restores_fresh_qdrant_and_lite_root
          docker run --rm --network "$network" \
            --env "CITADEL_QDRANT_RESTORE_KEY=$qdrant_key" \
            citadel-archive:ci-test python -c \
              "from qdrant_client import QdrantClient; import os; client = QdrantClient(url='http://$restore_success_qdrant:6333', api_key=os.environ['CITADEL_QDRANT_RESTORE_KEY']); assert client.get_collections().collections; client.close()"
          docker run --rm --network "$network" \
            --env "CITADEL_QDRANT_SERVER_IMAGE=$qdrant_image" \
            --env "CITADEL_QDRANT_LIVE_URL=http://$source_qdrant:6333" \
            --env "CITADEL_QDRANT_LIVE_KEY=$qdrant_key" \
            --env "CITADEL_QDRANT_RESTORE_URL=http://$restore_rollback_qdrant:6333" \
            --env "CITADEL_QDRANT_RESTORE_KEY=$qdrant_key" \
            citadel-archive:ci-test python -m pytest -q \
              tests/test_generation_backup_live.py::test_generation_restore_count_mismatch_rolls_back_real_qdrant_and_lite_root
          docker run --rm --network "$network" \
            --env "CITADEL_QDRANT_RESTORE_KEY=$qdrant_key" \
            citadel-archive:ci-test python -c \
              "from qdrant_client import QdrantClient; import os; client = QdrantClient(url='http://$restore_rollback_qdrant:6333', api_key=os.environ['CITADEL_QDRANT_RESTORE_KEY']); assert client.get_collections().collections == []; client.close()"
          capture_container_logs
          assert_clean_container_logs \
            "$log_dir/source-qdrant.log" "$log_dir/restore-success-qdrant.log" "$log_dir/restore-rollback-qdrant.log"

  container-runtime:
    name: production Compose readiness
    runs-on: ubuntu-latest
    # Same reasoning as container-tests: a cap on a hang, not a pace.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag citadel-archive:ci-runtime .

      - name: Prove Compose readiness with captured logs
        shell: bash
        run: |
          set -euo pipefail
          command -v grep >/dev/null
          project="citadel-compose-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          env_file="$RUNNER_TEMP/citadel-compose.env"
          qdrant_key="citadel-ci-qdrant-key"
          admin_key="citadel-ci-admin-key-000000000000"
          log_dir="$RUNNER_TEMP/citadel-container-runtime-logs"
          expected_qdrant_log_pattern='TLS (is )?disabled'
          expected_citadel_http_pattern='GET /readyz HTTP/1.1" 401 Unauthorized'
          # The severe-line classifier below is fail-closed, so a healthy boot
          # needs an exemption for each benign line it actually prints. One entry
          # per measured line class, each a distinctive substring of that line.
          # A healthy boot printed nine severe-pattern lines when this was
          # measured. These entries cover those known lines, including the exact
          # onnxruntime CPU-vendor warning printed by an ARM Docker Desktop run.
          # "warning  Cognee 1.0 changes: New API ...", the cognee import banner,
          # printed four times. An upstream notice about its own API, not a fault.
          expected_citadel_log_pattern='Cognee 1\.0 changes:'
          # "pydantic_settings/sources/utils.py:47: IncompleteFieldDefinitionWarning:
          # Field 'lifespan' has an incomplete definition ...", raised upstream while
          # the settings model is built. The app boots and serves through it.
          expected_citadel_log_pattern+="|IncompleteFieldDefinitionWarning: Field 'lifespan'"
          # The source echo Python prints beneath that warning. Exempting the echo
          # alone stays fail-closed: a new warning still fails on its message line.
          expected_citadel_log_pattern+='|warnings\.warn\('
          # "warning  No nodes found in the database", which is what an empty graph
          # reports, and a fresh CI boot has an empty graph.
          expected_citadel_log_pattern+='|No nodes found in the database'
          # "onnxruntime cpuid_info warning: Unknown CPU vendor. cpuinfo_vendor
          # value: 0", printed twice while loading the embedding runtime on ARM.
          expected_citadel_log_pattern+='|onnxruntime cpuid_info warning: Unknown CPU vendor'
          mkdir -p "$log_dir"
          cat > "$env_file" <<EOF
          CITADEL_IMAGE=citadel-archive:ci-runtime
          QDRANT_API_KEY=$qdrant_key
          CITADEL_GENERATION_ID=ci-compose-readiness
          CITADEL_ADMIN_KEY=$admin_key
          LLM_API_KEY=ci-dummy-key
          COGNEE_SKIP_CONNECTION_TEST=true
          EOF
          # Read both service logs once, after the fact, for the same reason as
          # container-tests: a backgrounded `logs --follow | tee` records tee's
          # pid, and the follower it leaves behind never returns.
          capture_runtime_logs() {
            docker compose --project-name "$project" --env-file "$env_file" logs --timestamps qdrant > "$log_dir/qdrant.log" 2>&1 || true
            docker compose --project-name "$project" --env-file "$env_file" logs --timestamps citadel > "$log_dir/citadel.log" 2>&1 || true
          }
          assert_clean_runtime_logs() {
            local log_file
            local -a grep_statuses
            local grep_status
            for log_file in "$@"; do
              # An empty file means the capture failed, not that the boot was
              # quiet, and a quiet boot is not something this stack produces.
              if [[ ! -s "$log_file" ]]; then
                echo "::error::No log was captured from $log_file"
                return 1
              fi
              # Fatal classes cannot share the warning allowlist. Otherwise a
              # warning substring on the same line can hide a fatal condition.
              if grep -Eni \
                'error|traceback|exception|died|critical|panic|fatal|oom|corrupt|failure|failed' \
                "$log_file"; then
                echo "::error::Unexpected fatal runtime log in $log_file"
                return 1
              else
                grep_status=$?
                if (( grep_status > 1 )); then
                  echo "::error::Fatal runtime log grep failed for $log_file"
                  return 1
                fi
              fi
              local expected_log_pattern="$expected_citadel_log_pattern"
              if [[ "$log_file" == "$log_dir/qdrant.log" ]]; then
                expected_log_pattern="$expected_qdrant_log_pattern"
              fi
              if grep -Eni \
                'warn(ing)?|recovery.*(shortfall|failed)' \
                "$log_file" | grep -Evi -- "$expected_log_pattern"; then
                echo "::error::Unexpected severe container log in $log_file"
                return 1
              else
                grep_statuses=("${PIPESTATUS[@]}")
                if (( grep_statuses[0] > 1 || grep_statuses[1] > 1 )); then
                  echo "::error::Runtime log classifier grep failed for $log_file"
                  return 1
                fi
              fi
            done
            if grep -En 'HTTP/[0-9.]+" [45][0-9][0-9]' \
              "$log_dir/qdrant.log"; then
              echo "::error::Unexpected Qdrant HTTP 4xx/5xx log"
              return 1
            else
              grep_status=$?
              if (( grep_status > 1 )); then
                echo "::error::Qdrant HTTP log grep failed"
                return 1
              fi
            fi
            if grep -En 'HTTP/[0-9.]+" [45][0-9][0-9]' \
              "$log_dir/citadel.log" \
              | grep -Ev -- "$expected_citadel_http_pattern"; then
              echo "::error::Unexpected Citadel HTTP 4xx/5xx log"
              return 1
            else
              grep_statuses=("${PIPESTATUS[@]}")
              if (( grep_statuses[0] > 1 || grep_statuses[1] > 1 )); then
                echo "::error::Citadel HTTP log classifier grep failed"
                return 1
              fi
            fi
            local public_path
            for public_path in \
              "/.well-known/citadel.json" \
              "/api/state" \
              "/skills" \
              "/skills/boundary" \
              "/skills/connect" \
              "/skills/proactive-ingest" \
              "/skills/vault"; do
              if ! grep -Fq -- \
                "GET $public_path HTTP/1.1\" 200 OK" "$log_dir/citadel.log"; then
                echo "::error::Missing successful public-route log for $public_path"
                return 1
              fi
            done
          }
          cleanup() {
            local exit_code=$?
            capture_runtime_logs
            if (( exit_code != 0 )); then
              local log_file
              for log_file in "$log_dir/qdrant.log" "$log_dir/citadel.log"; do
                if [[ -s "$log_file" ]]; then
                  echo "::group::Last 200 lines from $log_file"
                  tail --lines=200 "$log_file" || true
                  echo "::endgroup::"
                fi
              done
            fi
            docker compose --project-name "$project" --env-file "$env_file" ps || true
            docker compose --project-name "$project" --env-file "$env_file" down --volumes --remove-orphans || true
            rm -f "$env_file"
            trap - EXIT
            exit "$exit_code"
          }
          trap cleanup EXIT
          docker compose --project-name "$project" --env-file "$env_file" up --detach --no-build
          app="$(docker compose --project-name "$project" ps -q citadel)"
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$app")"
            if [[ "$status" == healthy ]]; then
              break
            fi
            if [[ "$status" == unhealthy ]]; then
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.Config.User}}' "$app")" = "10001:10001"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$app")" = healthy
          docker inspect --format '{{json .Mounts}}' "$app" \
            | python -c 'import json, sys; mounts = json.load(sys.stdin); assert not any(mount["Type"] == "bind" for mount in mounts), mounts'
          docker compose --project-name "$project" exec -T citadel python -I - <<'PY'
          import base64
          import hashlib
          import json
          from importlib.metadata import distribution
          from pathlib import Path
          import sysconfig
          from urllib.request import urlopen

          import kb
          import scripts
          from kb.repo_stats import count_adr_records
          from scripts.run_railway import run_evolve_in_loop

          purelib = Path(sysconfig.get_path("purelib")).resolve()
          assert Path(kb.__file__).resolve().is_relative_to(purelib)
          assert Path(scripts.__file__).resolve().is_relative_to(purelib)
          assert not Path("/src").exists()
          assert callable(run_evolve_in_loop)

          package_distribution = distribution("citadel-archive")
          installed = {
              str(path): package_distribution.locate_file(path)
              for path in package_distribution.files or ()
          }
          required = {
              "scripts/run_railway.py",
              "skills/citadel-data-boundary/SKILL.md",
              "skills/citadel-mcp-connector/SKILL.md",
              "skills/citadel-onboard/SKILL.md",
              "skills/citadel-proactive-ingest/README.md",
              "skills/citadel-proactive-ingest/SKILL.md",
              "skills/citadel-vault/SKILL.md",
              "skills/citadel/SKILL.md",
          }
          assert required <= installed.keys(), sorted(required - installed.keys())
          for name in required:
              installed_path = installed[name].resolve()
              assert installed_path.is_relative_to(purelib), installed_path
              assert installed_path.is_file(), installed_path
          adr_records = {
              name: path
              for name, path in installed.items()
              if name.startswith("docs/adr/")
              and name.endswith(".md")
              and name.rsplit("/", 1)[-1][:4].isdigit()
          }
          assert adr_records
          for installed_path in adr_records.values():
              installed_path = installed_path.resolve()
              assert installed_path.is_relative_to(purelib), installed_path
              assert installed_path.is_file(), installed_path
          assert count_adr_records() == len(adr_records)

          def fetch(path):
              with urlopen(f"http://127.0.0.1:8000{path}", timeout=12) as response:
                  assert response.status == 200
                  return response.headers, response.read()

          discovery_headers, discovery_body = fetch("/.well-known/citadel.json")
          catalog_headers, catalog_body = fetch("/skills")
          _, state_body = fetch("/api/state")
          assert discovery_headers["Cache-Control"] == "public, max-age=300"
          assert catalog_headers["Cache-Control"] == "public, max-age=300"
          discovery = json.loads(discovery_body)
          catalog = json.loads(catalog_body)
          assert discovery["ok"] is True
          assert catalog["ok"] is True
          assert discovery["skills"] == catalog["skills"]
          state = json.loads(state_body)
          assert state["repo"]["adrs"] == len(adr_records)

          expected = {
              "boundary": "citadel-data-boundary",
              "connect": "citadel-mcp-connector",
              "proactive-ingest": "citadel-proactive-ingest",
              "vault": "citadel-vault",
          }
          expected_aliases = {
              "boundary": ["citadel-data-boundary", "policy", "privacy", "public-private"],
              "connect": ["citadel-mcp-connector", "mcp", "mcp-connector"],
              "proactive-ingest": ["autosync", "citadel-proactive-ingest"],
              "vault": ["citadel-vault"],
          }
          rows = {row["slug"]: row for row in catalog["skills"]}
          assert set(rows) == set(expected)
          for slug, row in rows.items():
              assert row["aliases"] == expected_aliases[slug]
              headers, body = fetch(f"/skills/{slug}")
              assert body.startswith(f"---\nname: {expected[slug]}\n".encode())
              digest = hashlib.sha256(body).digest()
              sha256 = digest.hex()
              integrity = f"sha256-{base64.b64encode(digest).decode('ascii')}"
              assert headers["Content-Type"].startswith("text/markdown")
              assert headers["Cache-Control"] == "public, max-age=300"
              assert headers["ETag"] == f'"sha256-{sha256}"'
              assert headers["X-Citadel-Skill-SHA256"] == sha256
              assert headers["X-Citadel-Skill-Integrity"] == integrity
              assert row["sha256"] == sha256
              assert row["integrity"] == integrity
              assert row["size_bytes"] == len(body)
              for alias in row["aliases"]:
                  alias_headers, alias_body = fetch(f"/skills/{alias}")
                  assert alias_body == body
                  assert alias_headers["X-Citadel-Skill-SHA256"] == sha256
          PY
          docker compose --project-name "$project" exec -T citadel python -c '
          from urllib.error import HTTPError
          from urllib.request import urlopen
          try:
              urlopen("http://127.0.0.1:8000/readyz")
          except HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError("unauthenticated readiness was accepted")
          '
          docker compose --project-name "$project" exec -T citadel python -c \
            "import os; from urllib.request import Request, urlopen; request=Request('http://127.0.0.1:8000/readyz', headers={'Authorization':'Bearer '+os.environ['CITADEL_ADMIN_KEY']}); assert urlopen(request, timeout=12).status == 200"
          capture_runtime_logs
          assert_clean_runtime_logs "$log_dir/qdrant.log" "$log_dir/citadel.log"

  gate:
    name: CI gate
    # The single required status check for `main`.
    #
    # Keeping one stable name here means the matrix above can grow, shrink or be
    # renamed without an admin editing the branch ruleset. `if: always()` ensures
    # this job still runs — and fails — when a job it depends on fails.
    if: always()
    needs: [test, audit, plain-requirements-smoke, benchmark, web, package-smoke, container-tests, container-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::One or more required jobs did not succeed."
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: All clear
        run: echo "All required checks passed."
