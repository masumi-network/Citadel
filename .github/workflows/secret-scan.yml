name: Secret scan

# This repository is PUBLIC; the live vault it talks to is not. A committed
# `ctdl_` token authenticates against the production node, so secrets are a
# hard merge blocker rather than an advisory warning.
#
# We invoke the gitleaks BINARY (MIT licensed) rather than gitleaks-action,
# because that action requires a paid GITLEAKS_LICENSE key for repositories
# owned by a GitHub organization — which masumi-network is.
#
# Rules, including the Citadel-specific `ctdl_` token pattern, live in
# .gitleaks.toml at the repository root.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly full-history sweep catches anything committed before this workflow
    # existed, and anything a force-push slipped past the per-PR diff scan.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret is still a secret if it was removed in a
          # later commit but remains reachable in the object graph.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "pull_request" ]; then
            # Scan only what this PR adds. Pre-existing history is covered by
            # the weekly scheduled run, so a contributor is never blocked by a
            # finding they did not introduce.
            echo "log_opts=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          # --redact keeps any match out of the public log output. Printing the
          # secret into a world-readable Actions log would defeat the check.
          if [ -n "${LOG_OPTS}" ]; then
            gitleaks git . \
              --config .gitleaks.toml \
              --redact \
              --verbose \
              --log-opts "${LOG_OPTS}"
          else
            # --diff-merges=first-parent, because `git log -p` emits NOTHING for a
            # merge commit. Without it a credential typed into a conflict
            # resolution is never read by this job: it exists in neither parent,
            # so no other commit carries it either. On this repository that is 93
            # merges skipped out of 472 commits, 2 of which carry resolution
            # content differing from both parents. Only on the whole-history
            # sweep: on a pull request the same flag would diff a `Merge main`
            # commit against the branch and report everything main brought in as
            # if this PR introduced it. The tree scan below covers that case.
            gitleaks git . \
              --config .gitleaks.toml \
              --redact \
              --verbose \
              --log-opts "--diff-merges=first-parent"
          fi

      - name: Scan the checked-out tree
        run: |
          set -euo pipefail
          # State, not diff. `gitleaks git` reads commit diffs, so anything a
          # merge resolved is invisible to it on a pull request. This reads the
          # files as they actually are, which is also what .gitleaks.toml's
          # header claims was verified. Cheap: the tree is a fraction of the
          # history, and the same config means the same allowlists apply.
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --verbose

      - name: Explain a failure
        if: failure()
        run: |
          cat <<'EOF'
          ::error::gitleaks found a potential secret.

          Do NOT simply delete the line and push again: the value stays
          reachable in git history, and if it is a real credential it must be
          treated as compromised.

          1. Rotate the credential immediately (see SECURITY.md).
          2. Remove it from history (git rebase, or git filter-repo).
          3. If this is a false positive, add a narrow allowlist entry to
             .gitleaks.toml and explain why in the pull request.
          EOF
