name: Dependency review

# Two gates on every pull request that changes dependencies:
#
#   1. Security — block newly introduced packages with known vulnerabilities,
#      before they reach the lockfile. `pip-audit` in test.yml catches what is
#      already installed; this catches what a PR is trying to add.
#
#   2. Licence compatibility — Citadel ships under Apache-2.0. Pulling in a
#      strong-copyleft dependency would make the published PyPI distribution
#      undistributable under that licence. This is a licensing control, not
#      just a security one.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # Vulnerabilities below "high" are reported in the job summary but do
          # not block; the dependency is often transitive and unfixable in the
          # same PR. pip-audit still tracks them repo-wide.
          fail-on-severity: high

          # Strong copyleft is incompatible with redistributing this project
          # under Apache-2.0. Weak copyleft (LGPL, MPL-2.0) is intentionally
          # NOT denied — it is compatible when linked, not vendored.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, AGPL-1.0, SSPL-1.0

          # `ladybug` on PyPI is the LadybugDB embedded graph database (the
          # Kuzu successor), MIT-licensed: the 0.18.2 PyPI metadata declares
          # License: MIT and github.com/LadybugDB/ladybug carries an MIT
          # LICENSE. The dependency graph misclassifies it as
          # GPL-3.0-or-later, most plausibly stale metadata from the
          # unrelated Ladybug Tools project that also published under this
          # package name.
          #
          # The action's purlsMatch() compares package type and name only
          # and never reads the version, so despite the @0.18.2 suffix this
          # line exempts the package BY NAME at every version. The
          # compensating control is tests/test_dependency_pins.py::
          # test_ladybug_pin_matches_its_license_exemption, which fails on
          # any ladybug bump until the new version's license is re-verified
          # and the pins, this purl, and that test move together.
          allow-dependencies-licenses: pkg:pypi/ladybug@0.18.2

          comment-summary-in-pr: on-failure
