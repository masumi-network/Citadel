name: Publish to PyPI

# Publishes `citadel-archive` to PyPI on a version tag (e.g. v0.1.0) using
# PyPI Trusted Publishing (OIDC) — no API tokens are stored anywhere.
# One-time setup is documented in PUBLISHING.md.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_TAG#v}" = "$(python -c 'from kb import __version__; print(__version__)')"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Smoke test release artifact payloads
        run: |
          venv="$RUNNER_TEMP/citadel-wheel"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$venv/bin/python" - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          import tarfile

          webui = files("kb").joinpath("webui")
          assert webui.joinpath("index.html").is_file()
          assert webui.joinpath("404.html").is_file()
          assert webui.joinpath("_next").is_dir()

          sdist = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist, "r:gz") as archive:
              names = set(archive.getnames())
          assert any(name.endswith("/kb/webui/index.html") for name in names)
          print("release artifact webui payload verified")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "citadel-archive ${GITHUB_REF_NAME}"
          --generate-notes
