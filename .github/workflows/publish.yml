name: Publish to PyPI

# Publishes `citadel-archive` to PyPI on a version tag (e.g. v0.1.0) using
# PyPI Trusted Publishing (OIDC) — no API tokens are stored anywhere.
# One-time setup is documented in PUBLISHING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: read

jobs:
  release-guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - name: Require a successful CI gate for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_gates="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI gate" and .conclusion == "success")] | length')"
          test "$successful_gates" -ge 1

  build:
    name: Build sdist + wheel
    needs: release-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_TAG#v}" = "$(python -c 'from kb import __version__; print(__version__)')"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Smoke test release artifact payloads
        run: |
          venv="$RUNNER_TEMP/citadel-wheel"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$venv/bin/python" scripts/verify_package_artifacts.py --dist dist
          "$venv/bin/citadel" bench --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [release-guard, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "citadel-archive ${GITHUB_REF_NAME}"
          --generate-notes
