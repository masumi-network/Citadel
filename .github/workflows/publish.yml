name: Publish release

# Publishes one versioned Python and OCI release. The OCI image is staged by
# source SHA and both platform digests must pass before public promotion.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

env:
  IMAGE_NAME: ghcr.io/masumi-network/citadel

jobs:
  release-guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an exact semantic-version tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - name: Require a successful CI gate for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_gates="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI gate" and .conclusion == "success")] | length')"
          test "$successful_gates" -ge 1

  build:
    name: Build sdist + wheel
    needs: release-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_TAG#v}" = "$(python -c 'from kb import __version__; print(__version__)')"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Smoke test release artifact payloads
        run: |
          venv="$RUNNER_TEMP/citadel-wheel"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$venv/bin/python" scripts/verify_package_artifacts.py --dist dist
          "$venv/bin/citadel" bench --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  stage-image:
    name: Stage production OCI index
    needs: release-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and stage production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

  smoke-image:
    name: Smoke staged image (${{ matrix.platform }})
    needs: stage-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
          - platform: linux/arm64
            architecture: arm64
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve staged platform digest
        id: platform
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          INDEX_DIGEST: ${{ needs.stage-image.outputs.digest }}
        run: |
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}@${INDEX_DIGEST}" --raw)"
          # BuildKit provenance mode=max adds an attestation-manifest per
          # platform. That descriptor repeats the image digest in
          # vnd.docker.reference.digest, so grep -c over the raw index
          # counts 2 and fails a valid unique linux/<arch> image.
          platform_digest="$(jq -r \
            --arg architecture "$ARCHITECTURE" \
            '[.manifests[]
              | select(
                  .platform.os == "linux"
                  and .platform.architecture == $architecture
                  and (.mediaType == "application/vnd.oci.image.manifest.v1+json"
                       or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
                  and (.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest"
                )
              | .digest]
              | if length == 1 then .[0]
                else error("expected exactly one linux/\($architecture) image digest, got \(length)")
                end' \
            <<<"$manifest")"
          [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$platform_digest" >> "$GITHUB_OUTPUT"
      - name: Smoke exact platform digest
        env:
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
        run: |
          docker pull --platform "$PLATFORM" "${IMAGE_NAME}@${PLATFORM_DIGEST}"
          docker run --rm \
            --interactive \
            --platform "$PLATFORM" \
            --env "CITADEL_EXPECTED_VERSION=${GITHUB_REF_NAME#v}" \
            --entrypoint python \
            "${IMAGE_NAME}@${PLATFORM_DIGEST}" \
            -I - <<'PY'
          from importlib.metadata import distribution
          import os
          from pathlib import Path
          import sysconfig

          import cognee
          import kb
          import scripts
          from kb.repo_stats import count_adr_records
          from scripts.run_railway import run_evolve_in_loop

          assert kb.__version__ == os.environ["CITADEL_EXPECTED_VERSION"]
          purelib = Path(sysconfig.get_path("purelib")).resolve()
          assert Path(kb.__file__).resolve().is_relative_to(purelib)
          assert Path(scripts.__file__).resolve().is_relative_to(purelib)
          assert not Path("/src").exists()
          assert callable(run_evolve_in_loop)

          package = distribution("citadel-archive")
          installed = {
              str(item): package.locate_file(item)
              for item in package.files or ()
          }
          required = {
              "scripts/run_railway.py",
              "skills/citadel-data-boundary/SKILL.md",
              "skills/citadel-mcp-connector/SKILL.md",
              "skills/citadel-onboard/SKILL.md",
              "skills/citadel-proactive-ingest/README.md",
              "skills/citadel-proactive-ingest/SKILL.md",
              "skills/citadel-vault/SKILL.md",
              "skills/citadel/SKILL.md",
          }
          assert required <= installed.keys(), sorted(required - installed.keys())
          assert all(
              installed[name].resolve().is_relative_to(purelib)
              and installed[name].is_file()
              for name in required
          )
          assert count_adr_records() > 0
          PY

  attest-image:
    name: Attest staged OCI index
    needs: [stage-image, smoke-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Create keyless GitHub provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.stage-image.outputs.digest }}
          push-to-registry: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, attest-image]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  promote-image:
    name: Promote immutable OCI version
    needs: [stage-image, attest-image, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require unused version tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
            echo "refusing to overwrite existing image tag ${IMAGE_NAME}:${VERSION}" >&2
            exit 1
          fi
      - name: Promote staged index without rebuilding
        env:
          INDEX_DIGEST: ${{ needs.stage-image.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          metadata="$RUNNER_TEMP/citadel-promoted-image.json"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --metadata-file "$metadata" \
            "${IMAGE_NAME}@${INDEX_DIGEST}"
          promoted_digest="$(jq -r '.["containerimage.descriptor"].digest' "$metadata")"
          test "$promoted_digest" = "$INDEX_DIGEST"

  github-release:
    name: Create GitHub Release
    needs: [build, stage-image, promote-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Write image digest receipt
        env:
          INDEX_DIGEST: ${{ needs.stage-image.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          printf 'image=%s:%s@%s\nsource_sha=%s\n' \
            "$IMAGE_NAME" "$VERSION" "$INDEX_DIGEST" "$GITHUB_SHA" \
            > citadel-image-receipt.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          citadel-image-receipt.txt
          --repo "${GITHUB_REPOSITORY}"
          --title "citadel-archive ${GITHUB_REF_NAME}"
          --generate-notes
