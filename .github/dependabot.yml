version: 2

updates:
  # ---------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------
  # Third-party actions in this repository are pinned to a commit SHA with a
  # version comment. Dependabot understands that convention and will bump both
  # the SHA and the comment together, so pinning costs nothing in maintenance
  # while removing the "mutable tag gets repointed" supply-chain risk.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "type/chore"
      - "area/ci"
    groups:
      # One PR for routine bumps instead of five. Majors stay separate so a
      # breaking change is reviewed on its own.
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------
  # Python
  # ---------------------------------------------------------------------
  # pip-audit in test.yml reports vulnerabilities that already exist; this
  # opens the pull request that actually fixes them.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: scope
    labels:
      - "type/chore"
      - "area/ci"
    ignore:
      # cognee is pinned to 1.2.x ON PURPOSE. ADR-0009 dataset attribution and
      # the seat provisioning added for #147 read cognee PRIVATE internals
      # (cognee.modules.data.models, get_default_user, create_authorized_dataset)
      # that a minor bump can move, and DatasetNotFoundError is matched by class
      # NAME. The comment above the pin in requirements.txt says the pin exists
      # to stop Railway pulling one unattended; Dependabot does not read
      # comments, and proposed >=1.2.2,<1.5.0 in PR #167.
      #
      # Worse, CI could not have caught it: CI installs with
      # `uv sync --all-extras --dev` (pyproject + uv.lock) while Railway
      # installs from requirements.txt, so that PR was green against a cognee
      # version it would not have deployed.
      #
      # Upgrading cognee is a deliberate exercise: bump it, run the real-store
      # tests in tests/test_cognee_client.py, and check assert_cognee_dataset_api().
      - dependency-name: "cognee"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "pip-audit"
      server-minor-patch:
        update-types:
          - minor
          - patch
