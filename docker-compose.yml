name: citadel-lite

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    security_opt:
      - no-new-privileges:true

  citadel:
    image: ${CITADEL_IMAGE:-citadel-archive:local}
    build:
      context: ${CITADEL_SOURCE_DIR:-.}
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:${CITADEL_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      CITADEL_LITE_DATA_ROOT: /data
      CITADEL_GENERATION_ID: ${CITADEL_GENERATION_ID:?set CITADEL_GENERATION_ID in .env}
      CITADEL_ADMIN_KEY: ${CITADEL_ADMIN_KEY:?set CITADEL_ADMIN_KEY in .env}
      CITADEL_WRITER_KEYS: ${CITADEL_WRITER_KEYS:-}
      CITADEL_READER_KEYS: ${CITADEL_READER_KEYS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-custom}
      LLM_MODEL: ${LLM_MODEL:-openrouter/nvidia/nemotron-nano-9b-v2:free}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      COGNEE_SKIP_CONNECTION_TEST: ${COGNEE_SKIP_CONNECTION_TEST:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CITADEL_NEMOTRON_EMBEDDINGS_ENABLED: ${CITADEL_NEMOTRON_EMBEDDINGS_ENABLED:-false}
      VECTOR_DB_URL: http://qdrant:6333
      VECTOR_DB_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      VECTOR_DB_PROVIDER: qdrant
      VECTOR_DATASET_DATABASE_HANDLER: qdrant
      CITADEL_QDRANT_SERVER_IMAGE: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
      DB_PROVIDER: sqlite
      GRAPH_DATABASE_PROVIDER: ladybug
      ENABLE_BACKEND_ACCESS_CONTROL: "true"
      REQUIRE_AUTHENTICATION: "true"
      TELEMETRY_DISABLED: "true"
      AUTO_FEEDBACK: "false"
      XDG_CACHE_HOME: /data/model-cache
      # No HF_HOME override: the image bakes the tokenizer at /opt/hf-cache and
      # pins HF_HUB_OFFLINE=1; pointing HF_HOME at the volume made the bake
      # unreachable and silently degraded chunk sizing to TikToken (2026-08-12).
    volumes:
      - citadel-data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

volumes:
  citadel-data:
  qdrant-data:
  qdrant-snapshots:
