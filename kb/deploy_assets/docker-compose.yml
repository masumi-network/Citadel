name: citadel-lite

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    security_opt:
      - no-new-privileges:true

  citadel:
    image: ${CITADEL_IMAGE:-citadel-archive:local}
    build:
      context: ${CITADEL_SOURCE_DIR:-.}
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:${CITADEL_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      CITADEL_LITE_DATA_ROOT: /data
      CITADEL_GENERATION_ID: ${CITADEL_GENERATION_ID:?set CITADEL_GENERATION_ID in .env}
      CITADEL_ADMIN_KEY: ${CITADEL_ADMIN_KEY:?set CITADEL_ADMIN_KEY in .env}
      CITADEL_WRITER_KEYS: ${CITADEL_WRITER_KEYS:-}
      CITADEL_READER_KEYS: ${CITADEL_READER_KEYS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-custom}
      LLM_MODEL: ${LLM_MODEL:-openrouter/deepseek/deepseek-v4-flash}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      VECTOR_DB_URL: http://qdrant:6333
      VECTOR_DB_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      VECTOR_DB_PROVIDER: qdrant
      VECTOR_DATASET_DATABASE_HANDLER: qdrant
      CITADEL_QDRANT_SERVER_IMAGE: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
      DB_PROVIDER: sqlite
      GRAPH_DATABASE_PROVIDER: ladybug
      ENABLE_BACKEND_ACCESS_CONTROL: "true"
      REQUIRE_AUTHENTICATION: "true"
      TELEMETRY_DISABLED: "true"
      AUTO_FEEDBACK: "false"
      XDG_CACHE_HOME: /data/model-cache
      HF_HOME: /data/model-cache/huggingface
    volumes:
      - citadel-data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

volumes:
  citadel-data:
  qdrant-data:
