# gitleaks configuration for Citadel.
#
# Used by .github/workflows/secret-scan.yml. Extends the upstream default rule
# set (AWS keys, GitHub PATs, private keys, …) and adds the credential formats
# that are specific to this project.
#
# This repository is PUBLIC and the live vault is not. A leaked `ctdl_` token
# authenticates against the production node, so it is treated as a hard stop.
#
# Verified against gitleaks 8.30.1, in both directions: the history sweep and a
# scan of the tracked tree each report zero findings, and a planted real-shaped
# credential fails the scan in .env.example, in a test file with no fake marker,
# and in docs prose. Re-run both halves when editing an allowlist below. A green
# scan on its own does not tell you the scan still works.
#
# Two gaps stay open, so the paragraph above is not read as more than it says.
# `regexTarget = "line"` suppresses a real credential that shares a line with an
# allowlisted marker, which also lets a fake token pardon a real one beside it;
# it holds on config-shaped lines, where generic-api-key still fires, and leaks
# on prose and `export X=` lines. And the first block below carries no
# targetRules, so its three paths are exempt from every rule. Neither is a
# regression (the previous config ran the same patterns repo-wide under OR and
# missed strictly more), and neither is closed.

title = "Citadel gitleaks config"

[extend]
# Inherit every rule shipped with gitleaks, then add our own below.
useDefault = true

# ---------------------------------------------------------------------------
# Citadel-specific credential formats
# ---------------------------------------------------------------------------

[[rules]]
id = "citadel-access-token"
description = "Citadel seat/admin access token (ctdl_)"
# kb/access.py:168 -> f"ctdl_{secrets.token_urlsafe(32)}"
# token_urlsafe(32) yields 43 URL-safe base64 characters; the bounds below are
# deliberately loose so a future token length change still trips the rule.
regex = '''ctdl_[A-Za-z0-9_-]{32,64}'''
keywords = ["ctdl_"]

[[rules]]
id = "citadel-admin-key"
description = "Citadel admin access key assigned in config or env"
# `[ \t]` rather than `\s` around the separator. gitleaks matches against whole
# file content, not line by line, so `\s` crosses the newline: an EMPTY
# assignment then swallows the next line's variable name. `.env.example` ships
# `CITADEL_MCP_ACCESS_TOKEN=` directly above `CITADEL_MCP_DEFAULT_DATASET=…`,
# and that pair matched as a live key. Allowlisting the file was the wrong
# answer to a rule that should not have fired.
#
# The optional `\r?\n[ \t]+` puts back the one real shape that bounding to
# [ \t] alone lost: a value on the next line, INDENTED, as YAML and a wrapped
# Python assignment both write it. The indent is what makes it safe. The false
# positive above cannot satisfy it, because the next variable in a .env file
# starts at column 0. Losing this shape mattered most under tests/, where
# generic-api-key is relaxed and the admin key carries no `ctdl_` prefix for
# citadel-access-token to catch, so nothing else was covering it.
regex = '''(?i)\b(CITADEL_ADMIN_KEY|CITADEL_ACCESS_KEY|CITADEL_MCP_ACCESS_TOKEN)\b[ \t]*[:=][ \t]*(?:\r?\n[ \t]+)?['"]?[A-Za-z0-9_\-]{16,}['"]?'''
keywords = ["citadel_admin_key", "citadel_access_key", "citadel_mcp_access_token"]

# ---------------------------------------------------------------------------
# Allowlists
# ---------------------------------------------------------------------------
# NOTE: gitleaks deprecated the singular [allowlist] table; the plural
# [[allowlists]] form is required and the two cannot be mixed.

# EVERY block below names the rules it relaxes with `targetRules`. A block
# without it applies to all of them, the upstream high-precision rules
# included, and because gitleaks defaults to `condition = "OR"` a single
# `paths` or `regexes` entry is then enough on its own to disarm the scan
# repository-wide. That is how an earlier version of this file worked, and a
# live `ctdl_` token committed to .env.example scanned clean under it.

[[allowlists]]
description = "Files whose every credential-shaped string is fake by construction"
# The one place `targetRules` is deliberately absent, because these files are
# exempt from everything:
#   - test_security_scan.py is a corpus of synthetic credentials whose only
#     purpose is to prove kb/security_scan.py detects them.
#     AKIAIOSFODNN7EXAMPLE is AWS's own published documentation example, the
#     fine-grained token is "a1B2" * 12, and the password is "hunter2".
#     Scanning it will always "find" secrets.
#   - lock files and the audit cache hold hashes: high-entropy, not credentials.
paths = [
  '''^tests/test_security_scan\.py$''',
  '''^uv\.lock$''',
  '''^\.pip-audit-cache/''',
]

[[allowlists]]
description = "Synthetic credentials in test fixtures, matched on their fake shape"
# `condition = "AND"` so the path AND the shape both have to match. A real
# credential pasted into a test file carries none of these markers, so the
# high-precision rules still fail the scan there.
condition = "AND"
targetRules = [
  "citadel-access-token",
  "citadel-admin-key",
  "curl-auth-header",
  "github-pat",
]
paths = ['''^tests/''']
# Match against the whole source line, not just the captured secret, so the
# surrounding fixture context is visible.
regexTarget = "line"
regexes = [
  '''ctdl_(test|fake|dummy|sample|placeholder|stale|fresh|rotated|headless|abcdef)''',
  '''gh[pousr]_(abcd|example)''',
  # Redaction assertions feed a fake credential in to prove it is scrubbed.
  '''clip_excerpt\(''',
]

[[allowlists]]
description = "Documented config placeholders in docs and skills"
# Same AND pairing: only under docs/, skills/ and plugins/, and only where the
# line carries a literal placeholder instead of a value.
condition = "AND"
targetRules = ["citadel-access-token", "citadel-admin-key"]
paths = [
  '''^docs/''',
  '''^skills/''',
  '''^plugins/''',
]
regexTarget = "line"
regexes = [
  '''PASTE_[A-Z_]+''',
  '''<paste your ctdl_ token>''',
  '''ctdl_<''',
  '''ctdl_(…|\.\.\.|xxx|XXX|your|YOUR|paste|example|EXAMPLE|token)''',
]

[[allowlists]]
description = "Notes recording a token PREFIX while explaining the format"
# tasks.md and docs/progress.md record which service-account token was minted
# by its first few characters ("token prefix: `ctdl_…`"). A prefix is not a
# credential, and it is far too short for citadel-access-token to fire; only
# the generic heuristic sees it. The line has to say so, hence AND.
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^docs/''',
  '''^tasks\.md$''',
]
regexTarget = "line"
regexes = ['''token[ _-]prefix''']

[[allowlists]]
description = "generic-api-key heuristic is too noisy against test fixtures"
# `generic-api-key` is gitleaks' low-precision heuristic: it fires on anything
# shaped like `token = "..."`. Test fixtures are full of such strings by
# design, because several suites exist specifically to prove Citadel redacts
# credentials (tests/test_llm_enrichment.py feeds in
# "api_key=supersecretvalue1234 ... token: ctdl_abcdef123456" to assert it is
# scrubbed on the way out).
#
# We relax ONLY this one heuristic, and ONLY under tests/. Every high-precision
# rule — citadel-access-token, citadel-admin-key, github-pat, aws-access-token,
# stripe-access-token, private-key — stays fully armed there, so a real
# credential committed into a test file is still a hard failure.
targetRules = ["generic-api-key"]
paths = ['''^tests/''']
